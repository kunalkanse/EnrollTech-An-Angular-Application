<div class="course-card">
  <div class="course-card__description">
    <div class="course-card__description-title">{{ course?.title }}</div>
    <div class="course-card__description-text">{{ course?.description }}</div>
  </div>
  <div class="course-card__info">
    <div class="course-card__info-text">
      <div>
        <b>Authors: </b>
        {{ getAuthors(course?.authors) }}
      </div>
      <div>
        <b>Duration: </b
        ><span class="course-card__duration"
          >{{ course?.duration | duration }} hours</span
        >
      </div>
      <div>
        <b>Created: </b
        ><span class="course-card__date">{{
          course?.creationDate | customDate
        }}</span>
      </div>
    </div>
    <div class="course-card__info-actions">
      <div class="course-card__buttons">
        <app-button
          buttonText="show course"
          (click)="onShowCourse(course.id)"
        ></app-button>
        <app-button
          buttonText="edit course"
          (click)="onEditCourse(course.id)"
        ></app-button>
        <ng-container *ngIf="editable">
          <ng-content></ng-content>
        </ng-container>
      </div>
    </div>
  </div>
</div>
