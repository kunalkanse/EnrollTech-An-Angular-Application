<div class="login-form-container">
  <h2 class="text-align-center">Login</h2>
  <div class="app-plate">
    <form #loginForm="ngForm" (ngSubmit)="onLoginFormSubmitted(loginForm)">
      <div class="login-form">
        <div>
          <div class="form__control">
            <label for="email">Email</label>
            <input
              type="text"
              id="email"
              name="email"
              placeholder="Enter Email"
              emailValidator
              ngModel
              #email="ngModel"
            />
            <span
              id="emailErrorMessage"
              class="text-danger"
              *ngIf="(loginForm.submitted || email.touched) && email.errors"
            >
              {{
                email.errors["emailRequired"]
                  ? "Email is Required"
                  : "Invalid Email"
              }}</span
            >
          </div>
          <div class="form__control">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Enter Password"
              name="password"
              ngModel
              #password="ngModel"
              required
            />
            <span
              id="passwordErrorMessage"
              class="text-danger"
              *ngIf="
                (loginForm.submitted || password.touched) && password.errors
              "
              >Password is required.</span
            >
          </div>
        </div>
        <div>
          <div class="form__action">
            <app-button
              type="submit"
              buttonText="Submit"
              [disabled]="loginForm.invalid"
            ></app-button>
          </div>
          <div class="form__text">
            If you don't have an account you may
            <strong><a [routerLink]="['/registration']">Register</a></strong>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
